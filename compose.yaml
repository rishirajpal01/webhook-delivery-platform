# Local stack: Postgres, the service, and a mock receiver to send webhooks to.
#   docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
      POSTGRES_DB: webhooks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks"]
      interval: 2s
      timeout: 5s
      retries: 15

  webhookd:
    build: .
    environment:
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks?sslmode=disable
      LISTEN_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  mockreceiver:
    build: .
    entrypoint: ["mockreceiver"]
    # Fails 30% of requests so retries are visible once delivery lands.
    command: ["-addr", ":9000", "-fail-rate", "0.3"]
    ports:
      - "9000:9000"

volumes:
  pgdata:
