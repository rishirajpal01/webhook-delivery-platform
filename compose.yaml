# Local stack: Postgres, the service, and a mock receiver to send webhooks to.
#   docker compose up --build
#   then follow the README quickstart (scripts/quickstart.sh runs it)
#
# FOR YOUR OWN MACHINE ONLY. It turns the SSRF guard off and uses a known API
# key and database password, so every port is bound to localhost. To run it
# for real, see "Running in production" in docs/operations.md.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
      POSTGRES_DB: webhooks
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks"]
      interval: 2s
      timeout: 5s
      retries: 15

  webhookd:
    build: .
    environment:
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks?sslmode=disable
      LISTEN_ADDR: ":8080"
      API_KEY: dev-api-key-change-me
      # The mock receiver lives on the private compose network, so the SSRF
      # guard has to be off locally. Never set this in production.
      ALLOW_PRIVATE_NETWORKS: "true"
    ports:
      - "127.0.0.1:8080:8080"
    # Healthy once migrations ran and /readyz answers, so
    # "docker compose up --wait" returns only when the API is usable.
    healthcheck:
      test: ["CMD", "webhookd", "healthcheck"]
      interval: 1s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    # Time to finish and record in-flight sends on shutdown (docs/operations.md).
    stop_grace_period: 30s

  # Extra dispatcher replicas, off by default:
  #   docker compose --profile scale up --build --scale dispatcher=3
  dispatcher:
    profiles: [scale]
    build: .
    environment:
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks?sslmode=disable
      ROLE: dispatcher
      ALLOW_PRIVATE_NETWORKS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    stop_grace_period: 30s

  mockreceiver:
    build: .
    entrypoint: ["mockreceiver"]
    # Fails 30% of requests (MOCK_FAIL_RATE) so retries are visible, and verifies signatures
    # with the same secret the README quickstart gives the endpoint.
    command:
      - -addr=:9000
      - -fail-rate=${MOCK_FAIL_RATE:-0.3}
      - -secret=whsec_ZGVtby1zZWNyZXQtZm9yLWxvY2FsLWRldi1vbmx5ISE=
    ports:
      - "127.0.0.1:9000:9000"

volumes:
  pgdata:
