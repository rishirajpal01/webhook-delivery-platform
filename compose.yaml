# Local stack: Postgres, the service, and a mock receiver to send webhooks to.
#   docker compose up --build
#   scripts/demo.sh
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
      POSTGRES_DB: webhooks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks"]
      interval: 2s
      timeout: 5s
      retries: 15

  webhookd:
    build: .
    environment:
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks?sslmode=disable
      LISTEN_ADDR: ":8080"
      API_KEY: dev-api-key-change-me
      # The mock receiver lives on the private compose network, so the SSRF
      # guard has to be off locally. Never set this in production.
      ALLOW_PRIVATE_NETWORKS: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  mockreceiver:
    build: .
    entrypoint: ["mockreceiver"]
    # Fails 30% of requests (MOCK_FAIL_RATE) so retries are visible, and verifies signatures
    # with the same secret scripts/demo.sh gives the endpoint.
    command:
      - -addr=:9000
      - -fail-rate=${MOCK_FAIL_RATE:-0.3}
      - -secret=whsec_ZGVtby1zZWNyZXQtZm9yLWxvY2FsLWRldi1vbmx5ISE=
    ports:
      - "9000:9000"

volumes:
  pgdata:
