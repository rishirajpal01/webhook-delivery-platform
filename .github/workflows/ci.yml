name: CI

# Every push runs CI, so branches are checked before they are merged to main.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webhooks
          POSTGRES_PASSWORD: webhooks
          POSTGRES_DB: webhooks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhooks"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://webhooks:webhooks@localhost:5432/webhooks?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Vulnerabilities
        run: make vuln
      - name: Test
        run: make test

  # Phase 4 exit gate: from a clean checkout, the README quickstart as
  # written brings the stack up and gets a delivery the receiver verified.
  quickstart:
    runs-on: ubuntu-latest
    env:
      # No random receiver failures, so the run is deterministic.
      MOCK_FAIL_RATE: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Run the README quickstart
        run: scripts/quickstart.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v
