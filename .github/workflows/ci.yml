name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webhooks
          POSTGRES_PASSWORD: webhooks
          POSTGRES_DB: webhooks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhooks"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://webhooks:webhooks@localhost:5432/webhooks?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Test
        run: make test

  # The stack comes up from a clean checkout and delivers a signed webhook.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        # No random failures here, so the end-to-end check is deterministic.
        run: MOCK_FAIL_RATE=0 docker compose up --build -d --wait
      - name: Check health
        run: |
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/readyz
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://localhost:9000/healthz
      - name: Send a webhook end to end
        run: scripts/demo.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v
